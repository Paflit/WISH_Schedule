name: Build & Release (Windows)

on:
  push:
    tags:
      - "v1.1"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (spec)
        run: |
          pyinstaller --noconfirm --clean WISH_Schedule.spec

      - name: Prepare portable folder
        run: |
          mkdir release_out
          xcopy /E /I /Y dist\WISH_Schedule release_out\WISH_Schedule
          if not exist release_out\WISH_Schedule\data mkdir release_out\WISH_Schedule\data
          if not exist release_out\WISH_Schedule\exports mkdir release_out\WISH_Schedule\exports
          if not exist release_out\WISH_Schedule\imports mkdir release_out\WISH_Schedule\imports
          if not exist release_out\WISH_Schedule\logs mkdir release_out\WISH_Schedule\logs
          if exist data\schedule.db xcopy /Y data\schedule.db release_out\WISH_Schedule\data\

      - name: Zip portable build
        run: |
          powershell -Command "Compress-Archive -Path release_out\WISH_Schedule -DestinationPath WISH_Schedule-win64.zip -Force"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: WISH Schedule v1.1
          files: WISH_Schedule-win64.zip
