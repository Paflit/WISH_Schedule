name: Build & Release (Windows)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (spec)
        run: |
          python -m PyInstaller --noconfirm --clean WISH_Schedule.spec

      - name: Prepare portable folder
        run: |
          New-Item -ItemType Directory -Force -Path release_out | Out-Null
          Copy-Item -Recurse -Force dist\WISH_Schedule release_out\WISH_Schedule
          New-Item -ItemType Directory -Force -Path release_out\WISH_Schedule\data | Out-Null
          New-Item -ItemType Directory -Force -Path release_out\WISH_Schedule\exports | Out-Null
          New-Item -ItemType Directory -Force -Path release_out\WISH_Schedule\imports | Out-Null
          New-Item -ItemType Directory -Force -Path release_out\WISH_Schedule\logs | Out-Null
          if (Test-Path data\schedule.db) { Copy-Item -Force data\schedule.db release_out\WISH_Schedule\data\schedule.db }

      - name: Zip portable build
        run: |
          powershell -Command "Compress-Archive -Path release_out\WISH_Schedule -DestinationPath WISH_Schedule-win64.zip -Force"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WISH Schedule ${{ github.ref_name }}
          files: WISH_Schedule-win64.zip
